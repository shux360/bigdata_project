services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper: {condition: service_healthy}
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: smartgrid
      POSTGRES_USER: smartgrid
      POSTGRES_PASSWORD: smartgrid
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgrid"]
      interval: 5s
      timeout: 5s
      retries: 12

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
      HOME: /tmp
      SPARK_SUBMIT_OPTS: -Duser.home=/tmp
    volumes:
      - ./spark-checkpoints:/opt/project/checkpoints
    command: ["/opt/spark/bin/spark-submit", "/opt/project/src/processing/stream_processor.py"]

  meter-producer:
    build: .
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: ["python", "-m", "src.producers.meter_producer"]

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8000:8000"]
    environment:
      POSTGRES_HOST: postgres
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      POSTGRES_HOST: postgres
    command: standalone

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports: ["9090:9090"]

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on: [prometheus]

volumes:
  pgdata:

