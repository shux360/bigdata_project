groups:
  - name: smart-grid
    rules:
      - alert: SmartGridApiDown
        expr: up{job="smart-grid-api"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: "Smart Grid API has been unreachable for one minute"}
      - alert: SmartGridApiErrorRate
        expr: sum(rate(api_requests_total{status=~"5.."}[2m])) / clamp_min(sum(rate(api_requests_total[2m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: "API error rate exceeds 5%"}

